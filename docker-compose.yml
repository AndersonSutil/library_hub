version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library_hub_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/library
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      - mongo
      - redis
    networks:
      - library_network

  mongo:
    image: mongo:latest
    container_name: library_hub_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - library_network

  redis:
    image: redis:latest
    container_name: library_hub_redis
    ports:
      - "6379:6379"
    networks:
      - library_network

networks:
  library_network:
    driver: bridge

volumes:
  mongo_data:
